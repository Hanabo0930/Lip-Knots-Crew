name: Release Candidate Checks

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build, regression tests and high-severity audit
        run: npm run verify
      - name: Publish verification summary
        if: always()
        run: |
          {
            echo "## Release Candidate Checks"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Production deploy: \`not configured\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Production deploy is intentionally absent.
  # Add a protected environment and manual approval before enabling.
