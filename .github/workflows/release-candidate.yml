name: Release Candidate Checks

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build all deployable artifacts
        run: npm run build
      - name: Validate web startup and transfer size
        run: |
          npm run test:bundle-size
          if [[ -f scripts/check-web-boot-bundles.mjs ]]; then
            node scripts/check-web-boot-bundles.mjs
          fi
          npm run test:admin-startup
          node scripts/test-admin-action-confirmation.mjs
          node scripts/test-admin-expense-recovery.mjs
          node scripts/test-admin-expense-status.mjs
      - name: Validate Staff workflows and company isolation
        run: |
          npm run test:staff-company-scope
          npm run test:staff-ux-performance
          node scripts/test-staff-submission-recovery.mjs
          node scripts/test-staff-shift-cards.mjs
          node scripts/test-staff-application-confirmation.mjs
          node scripts/test-staff-manual-refresh.mjs
      - name: Install browser for local-only Staff demo checks
        run: npx playwright install --with-deps chromium --only-shell
      - name: Validate Staff browser recovery and layout
        run: |
          node scripts/test-staff-submission-flow.mjs --browser
          node scripts/test-staff-shift-rendering.mjs
          node scripts/test-admin-workspace.mjs --browser
          node scripts/test-case-mail-entry-readiness.mjs
          node scripts/test-admin-import-snapshot.mjs
          node scripts/test-submission-attempt-browser.mjs
          node scripts/test-admin-comparison-pages.mjs
          node scripts/test-case-mail-review-browser.mjs release-evidence/ci-mail-review --resolve-only
      - name: Run release orchestration regressions
        run: |
          npm run test:preview-demo
          npm run test:production-setup
          npm run test:production-deploy-readiness
          npm run test:production-deploy-orchestration
          npm run test:production-acceptance
          npm run test:known-good-rollback-bundle
          npm run test:production-rollback-command
          npm run test:production-evidence-sync
          npm run test:production-evidence-security
          npm run test:staging-preflight
          npm run test:staging-automation
          node scripts/automation/test-hosting-build.mjs
          npm run test:release-checkpoint
          npm run test:staging-smoke
          npm run test:production-rehearsal
      - name: Publish verification summary
        if: always()
        run: |
          {
            echo "## Web and release checks"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Production deploy: \`not configured\`"
          } >> "$GITHUB_STEP_SUMMARY"

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and test Functions
        run: |
          npm run build -w @lkc/functions
          node scripts/test-cancellation-lock-ownership.mjs
          node scripts/test-admin-publication-export.mjs
          node scripts/test-shift-import-transactions.mjs
          node scripts/test-shift-lifecycle.mjs
          node scripts/test-submission-lifecycle.mjs
          node scripts/test-paused-submission-replay.mjs
          node scripts/test-submission-acceptance-kit.mjs
          node scripts/test-submission-acceptance-result.mjs
          node scripts/test-expense-completion-integrity.mjs
          node scripts/test-safe-sheet-precontact.mjs
          node scripts/test-sheet-row-creation-pause.mjs
          node scripts/test-emulator-seed-safety.mjs
          node scripts/test-shift-import-lease.mjs
          node scripts/test-staff-import-revocation.mjs
          node scripts/test-login-link-identity.mjs
          node scripts/test-bootstrap-session-identity.mjs
          node scripts/test-notification-delivery.mjs
          node scripts/test-notification-delivery-pause.mjs
          node scripts/test-precontact-reminder-readiness.mjs
          node scripts/test-reminder-generation-pause.mjs
          node scripts/automation/test-notification-auth-guard.mjs
          node scripts/automation/test-staging-notification-pause.mjs
          node scripts/automation/test-staging-sheet-worker.mjs
          node scripts/automation/test-retry-worker-recovery.mjs
          node scripts/test-month-sheet-lifecycle.mjs
          node scripts/test-sheet-write-review.mjs
          node scripts/test-readiness-company-boundaries.mjs
          node scripts/test-pilot-expansion-lifecycle.mjs
          node scripts/test-automation-registry.mjs
          node scripts/test-automation-intake.mjs
          node scripts/test-case-mail-intake-roundtrip.mjs
          node scripts/test-case-mail-job-creation.mjs
          node scripts/automation/test-admin-core-auth-guard.mjs
          node scripts/automation/test-staff-journey-auth-guard.mjs
          node scripts/automation/test-case-mail-auth-guard.mjs
          node scripts/test-case-mail-review.mjs
          node scripts/test-case-mail-targets.mjs
          node scripts/test-case-mail-publication.mjs
          node scripts/test-case-mail-assignment.mjs
          node scripts/test-case-mail-preparation.mjs
          node scripts/test-case-mail-resolution.mjs
          node scripts/test-case-mail-target-binding.mjs
          node scripts/test-case-mail-target-hold.mjs
          node scripts/test-case-mail-target-resolution.mjs
          node scripts/test-automation-held-receipts.mjs
          node scripts/test-automation-campaigns.mjs
          node scripts/test-automation-import-snapshot.mjs
          node scripts/test-automation-notice-receipts.mjs
          node scripts/test-automation-notice-handoff.mjs
          node scripts/test-shift-integrity-diagnostics.mjs
          node scripts/test-staging-shift-integrity-reader.mjs
          node scripts/test-admin-reassignment-locks.mjs
          npm test
      - name: Validate isolated Firestore business journey
        timeout-minutes: 5
        run: |
          node scripts/test-local-firestore-acceptance-safety.mjs
          test -x "$JAVA_HOME_21_X64/bin/java"
          node -e "require('firebase-tools/lib/emulator/downloadableEmulators').downloadIfNecessary('firestore')"
          emulator_jar=$(node -p "require('firebase-tools/lib/emulator/downloadableEmulators').getDownloadDetails('firestore').downloadPath")
          node scripts/run-local-firestore-acceptance.mjs --java "$JAVA_HOME_21_X64/bin/java" --jar "$emulator_jar" --evidence release-evidence/ci-local-firestore
          node scripts/run-local-firestore-acceptance.mjs --suite rules --java "$JAVA_HOME_21_X64/bin/java" --jar "$emulator_jar" --evidence release-evidence/ci-local-firestore-rules
          node scripts/run-local-firestore-acceptance.mjs --suite mail --java "$JAVA_HOME_21_X64/bin/java" --jar "$emulator_jar" --evidence release-evidence/ci-local-case-mail
          node scripts/run-local-firestore-acceptance.mjs --suite login-cleanup --java "$JAVA_HOME_21_X64/bin/java" --jar "$emulator_jar" --evidence release-evidence/ci-local-login-cleanup
          node scripts/run-local-firestore-acceptance.mjs --suite row-queue --java "$JAVA_HOME_21_X64/bin/java" --jar "$emulator_jar" --evidence release-evidence/ci-local-row-queue
          node scripts/run-local-firestore-acceptance.mjs --suite row-success --java "$JAVA_HOME_21_X64/bin/java" --jar "$emulator_jar" --evidence release-evidence/ci-local-row-success
          node scripts/run-local-firestore-acceptance.mjs --suite creation-journey --java "$JAVA_HOME_21_X64/bin/java" --jar "$emulator_jar" --evidence release-evidence/ci-local-creation-journey
      - name: Validate received staff journey
        timeout-minutes: 3
        run: |
          emulator_jar=$(node -p "require('firebase-tools/lib/emulator/downloadableEmulators').getDownloadDetails('firestore').downloadPath")
          node scripts/run-local-firestore-acceptance.mjs --suite received-staff-journey --java "$JAVA_HOME_21_X64/bin/java" --jar "$emulator_jar" --evidence release-evidence/ci-local-received-staff-journey
      - name: Publish Functions summary
        if: always()
        run: |
          {
            echo "## Functions checks"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate automation scope and production dependencies
        run: |
          npm run test:automation-safety
          python3 scripts/automation/test-hosting-api-readiness.py
          python3 scripts/automation/test-sheet-worker-migration.py
          npm audit --omit=dev --audit-level=high
      - name: Publish security summary
        if: always()
        run: |
          {
            echo "## Security checks"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Long-lived cloud key: \`not used\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Production deploy is intentionally absent.
  # Add a protected environment and manual approval before enabling.
