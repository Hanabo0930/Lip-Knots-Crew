name: Staging Functions Deploy

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: CI-passing source branch
        required: true
        type: string
        default: main
      functions:
        description: Explicit comma-separated allowlisted Functions
        required: true
        type: string
        default: bootstrapSession
      confirmation:
        description: Type DEPLOY_LKC_STAGING_FUNCTIONS
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: lkc-staging-functions-deploy
  cancel-in-progress: false

env:
  LKC_PROJECT_ID: lip-knots-crew-staging
  LKC_REGION: asia-northeast1

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit enable switch
        env:
          LKC_DEPLOY_ENABLED: ${{ vars.LKC_STAGING_DEPLOY_ENABLED }}
        run: |
          if [[ "$LKC_DEPLOY_ENABLED" != "true" ]]; then
            echo "Staging deploy remains disabled until Phase A diagnosis and WIF bootstrap are complete."
            exit 1
          fi
      - name: Checkout trusted guardrails
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: guardrails
      - name: Validate requested scope
        env:
          LKC_SOURCE_REF: ${{ inputs.source_ref }}
          LKC_FUNCTIONS: ${{ inputs.functions }}
          LKC_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node guardrails/scripts/automation/validate-staging-scope.mjs \
            --mode functions-deploy \
            --project "$LKC_PROJECT_ID" \
            --region "$LKC_REGION" \
            --source-ref "$LKC_SOURCE_REF" \
            --functions "$LKC_FUNCTIONS" \
            --confirmation "$LKC_CONFIRMATION"
      - name: Checkout requested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          path: source
      - name: Verify application-level authorization in source
        env:
          LKC_FUNCTIONS: ${{ inputs.functions }}
        run: |
          git -C source fetch --no-tags --depth=200 origin main
          node guardrails/scripts/automation/check-deploy-source-integrity.mjs \
            --repository source \
            --base origin/main \
            --head HEAD
          node guardrails/scripts/automation/check-function-auth-guards.mjs \
            --repository source \
            --ref "$(git -C source rev-parse HEAD)" \
            --functions "$LKC_FUNCTIONS" \
            --require-pass
      - name: Require successful canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(git -C source rev-parse HEAD)"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${source_sha}&status=completed&per_page=50" \
            | node -e '
                let input = "";
                process.stdin.on("data", (chunk) => input += chunk);
                process.stdin.on("end", () => {
                  const document = JSON.parse(input);
                  const passed = (document.workflow_runs ?? []).some((run) =>
                    run.name === "Release Candidate Checks" && run.conclusion === "success"
                  );
                  if (!passed) {
                    console.error("CANONICAL_CI=NOT_SUCCESSFUL");
                    process.exit(1);
                  }
                  console.log("CANONICAL_CI=SUCCESS");
                });
              '

  deploy:
    needs: guard
    environment: lkc-staging-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted guardrails
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: guardrails
      - name: Checkout requested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          path: source
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install and build Functions
        working-directory: source
        run: |
          npm ci
          npm run build -w @lkc/functions
      - name: Authenticate with short-lived staging identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Materialize verified staging Functions dotenv
        working-directory: source
        env:
          LKC_FUNCTIONS_ADMIN_EMAILS: ${{ vars.LKC_FUNCTIONS_ADMIN_EMAILS }}
          LKC_FUNCTIONS_EXECUTIVE_APPROVER_EMAILS: ${{ vars.LKC_FUNCTIONS_EXECUTIVE_APPROVER_EMAILS }}
          LKC_FUNCTIONS_PRODUCTION_FIREBASE_PROJECT_ID: ${{ vars.LKC_FUNCTIONS_PRODUCTION_FIREBASE_PROJECT_ID }}
          LKC_FUNCTIONS_APPROVAL_PACKAGE_KEY_ID: ${{ vars.LKC_FUNCTIONS_APPROVAL_PACKAGE_KEY_ID }}
          LKC_FUNCTIONS_DEFAULT_COMPANY_ID: ${{ vars.LKC_FUNCTIONS_DEFAULT_COMPANY_ID }}
          LKC_FUNCTIONS_STAFF_APP_URL: ${{ vars.LKC_FUNCTIONS_STAFF_APP_URL }}
          LKC_FUNCTIONS_ADMIN_APP_URL: ${{ vars.LKC_FUNCTIONS_ADMIN_APP_URL }}
          LKC_FUNCTIONS_MAIL_FROM: ${{ vars.LKC_FUNCTIONS_MAIL_FROM }}
          LKC_FUNCTIONS_PUBLIC_LOGIN_GATEWAY_URL: ${{ vars.LKC_FUNCTIONS_PUBLIC_LOGIN_GATEWAY_URL }}
          LKC_FUNCTIONS_FILE_PREVIEW_GATEWAY_URL: ${{ vars.LKC_FUNCTIONS_FILE_PREVIEW_GATEWAY_URL }}
        run: |
          required=(
            LKC_FUNCTIONS_ADMIN_EMAILS
            LKC_FUNCTIONS_EXECUTIVE_APPROVER_EMAILS
            LKC_FUNCTIONS_PRODUCTION_FIREBASE_PROJECT_ID
            LKC_FUNCTIONS_APPROVAL_PACKAGE_KEY_ID
            LKC_FUNCTIONS_DEFAULT_COMPANY_ID
            LKC_FUNCTIONS_STAFF_APP_URL
            LKC_FUNCTIONS_ADMIN_APP_URL
            LKC_FUNCTIONS_MAIL_FROM
            LKC_FUNCTIONS_PUBLIC_LOGIN_GATEWAY_URL
            LKC_FUNCTIONS_FILE_PREVIEW_GATEWAY_URL
          )
          missing=()
          invalid=()
          for name in "${required[@]}"; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              missing+=("$name")
            elif [[ "$value" == *        working-directory: guardrails
        env:
          LKC_SOURCE_REF: ${{ inputs.source_ref }}
          LKC_FUNCTIONS: ${{ inputs.functions }}
          LKC_CONFIRMATION: ${{ inputs.confirmation }}
          LKC_SOURCE_DIRECTORY: ${{ github.workspace }}/source
        run: bash scripts/automation/deploy-staging-functions.sh
\n'* || "$value" == *        working-directory: guardrails
        env:
          LKC_SOURCE_REF: ${{ inputs.source_ref }}
          LKC_FUNCTIONS: ${{ inputs.functions }}
          LKC_CONFIRMATION: ${{ inputs.confirmation }}
          LKC_SOURCE_DIRECTORY: ${{ github.workspace }}/source
        run: bash scripts/automation/deploy-staging-functions.sh
\r'* ]]; then
              invalid+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 || ${#invalid[@]} > 0 )); then
            printf 'STAGING_DOTENV_MISSING=%s\n' "$(IFS=,; echo "${missing[*]}")" >&2
            printf 'STAGING_DOTENV_INVALID=%s\n' "$(IFS=,; echo "${invalid[*]}")" >&2
            exit 1
          fi

          dotenv_path="functions/.env.${LKC_PROJECT_ID}"
          umask 077
          {
            printf 'APP_ENVIRONMENT=staging\n'
            printf 'EXPECTED_FIREBASE_PROJECT_ID=%s\n' "$LKC_PROJECT_ID"
            printf 'ADMIN_EMAILS=%s\n' "$LKC_FUNCTIONS_ADMIN_EMAILS"
            printf 'EXECUTIVE_APPROVER_EMAILS=%s\n' "$LKC_FUNCTIONS_EXECUTIVE_APPROVER_EMAILS"
            printf 'PRODUCTION_FIREBASE_PROJECT_ID=%s\n' "$LKC_FUNCTIONS_PRODUCTION_FIREBASE_PROJECT_ID"
            printf 'APPROVAL_PACKAGE_KEY_ID=%s\n' "$LKC_FUNCTIONS_APPROVAL_PACKAGE_KEY_ID"
            printf 'DEFAULT_COMPANY_ID=%s\n' "$LKC_FUNCTIONS_DEFAULT_COMPANY_ID"
            printf 'STAFF_APP_URL=%s\n' "$LKC_FUNCTIONS_STAFF_APP_URL"
            printf 'ADMIN_APP_URL=%s\n' "$LKC_FUNCTIONS_ADMIN_APP_URL"
            printf 'MAIL_FROM=%s\n' "$LKC_FUNCTIONS_MAIL_FROM"
            printf 'PUBLIC_LOGIN_GATEWAY_URL=%s\n' "$LKC_FUNCTIONS_PUBLIC_LOGIN_GATEWAY_URL"
            printf 'FILE_PREVIEW_GATEWAY_URL=%s\n' "$LKC_FUNCTIONS_FILE_PREVIEW_GATEWAY_URL"
          } > "$dotenv_path"
          chmod 600 "$dotenv_path"
          echo "STAGING_DOTENV=READY"
          echo "STAGING_DOTENV_KEY_COUNT=12"
      - name: Deploy only the explicit Functions allowlist
        working-directory: guardrails
        env:
          LKC_SOURCE_REF: ${{ inputs.source_ref }}
          LKC_FUNCTIONS: ${{ inputs.functions }}
          LKC_CONFIRMATION: ${{ inputs.confirmation }}
          LKC_SOURCE_DIRECTORY: ${{ github.workspace }}/source
        run: bash scripts/automation/deploy-staging-functions.sh
