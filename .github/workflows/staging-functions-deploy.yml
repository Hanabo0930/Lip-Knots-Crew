name: Staging Functions Deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy Functions, refresh the upload pair source, smoke one mail, or audit privacy
        required: true
        type: choice
        options:
          - deploy
          - upload-source-refresh
          - gmail-smoke
          - cancellation-privacy-audit
        default: deploy
      source_ref:
        description: CI-passing source branch
        required: true
        type: string
        default: main
      functions:
        description: Explicit comma-separated allowlisted Functions
        required: true
        type: string
        default: bootstrapSession
      transfer_mode:
        description: Preserve transfer state; explicit changes require finalizeStagedUpload, optionally with createUploadSession
        required: true
        type: choice
        options:
          - preserve
          - active
          - paused
          - acceptance
        default: preserve
      confirmation:
        description: Type the confirmation required by the selected operation
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: lkc-staging-functions-deploy
  cancel-in-progress: false

env:
  LKC_PROJECT_ID: lip-knots-crew-staging
  LKC_REGION: asia-northeast1

jobs:
  guard:
    outputs:
      source_sha: ${{ steps.source-identity.outputs.source_sha }}
    if: inputs.operation == 'deploy' || inputs.operation == 'upload-source-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit enable switch
        env:
          LKC_DEPLOY_ENABLED: ${{ vars.LKC_STAGING_DEPLOY_ENABLED }}
        run: |
          if [[ "$LKC_DEPLOY_ENABLED" != "true" ]]; then
            echo "Staging deploy remains disabled until Phase A diagnosis and WIF bootstrap are complete."
            exit 1
          fi
      - name: Checkout trusted guardrails
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: guardrails
      - name: Validate requested scope
        env:
          LKC_SOURCE_REF: ${{ inputs.source_ref }}
          LKC_FUNCTIONS: ${{ inputs.functions }}
          LKC_CONFIRMATION: ${{ inputs.confirmation }}
          LKC_OPERATION: ${{ inputs.operation }}
          LKC_TRANSFER_MODE_REQUESTED: ${{ inputs.transfer_mode }}
        run: |
          lkc_mode=functions-deploy
          if [[ "$LKC_OPERATION" == "upload-source-refresh" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" || "$LKC_TRANSFER_MODE_REQUESTED" != "preserve" || "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
              echo UPLOAD_REFRESH_PROTECTED_CONTEXT_REQUIRED >&2
              exit 1
            fi
            lkc_mode=functions-upload-source-refresh
          fi
          node guardrails/scripts/automation/validate-staging-scope.mjs \
            --mode "$lkc_mode" \
            --project "$LKC_PROJECT_ID" \
            --region "$LKC_REGION" \
            --source-ref "$LKC_SOURCE_REF" \
            --functions "$LKC_FUNCTIONS" \
            --confirmation "$LKC_CONFIRMATION"
      - name: Checkout requested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          path: source
      - name: Verify application-level authorization in source
        id: source-identity
        env:
          LKC_FUNCTIONS: ${{ inputs.functions }}
        run: |
          git -C source fetch --no-tags --depth=200 origin main
          node guardrails/scripts/automation/check-deploy-source-integrity.mjs \
            --repository source \
            --base origin/main \
            --head HEAD
          node guardrails/scripts/automation/check-function-auth-guards.mjs \
            --repository source \
            --ref "$(git -C source rev-parse HEAD)" \
            --functions "$LKC_FUNCTIONS" \
            --require-pass
          echo "source_sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require successful canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(git -C source rev-parse HEAD)"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${source_sha}&status=completed&per_page=50" \
            | node -e '
                let input = "";
                process.stdin.on("data", (chunk) => input += chunk);
                process.stdin.on("end", () => {
                  const document = JSON.parse(input);
                  const passed = (document.workflow_runs ?? []).some((run) =>
                    run.name === "Release Candidate Checks" && run.conclusion === "success"
                  );
                  if (!passed) {
                    console.error("CANONICAL_CI=NOT_SUCCESSFUL");
                    process.exit(1);
                  }
                  console.log("CANONICAL_CI=SUCCESS");
                });
              '

  deploy:
    if: inputs.operation == 'deploy' || inputs.operation == 'upload-source-refresh'
    needs: guard
    environment: lkc-staging-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout trusted guardrails
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: guardrails
      - name: Checkout requested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          path: source
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Verify the checked source commit
        working-directory: source
        env:
          LKC_VERIFIED_SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
        run: |
          if [[ ! "$LKC_VERIFIED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$(git rev-parse HEAD)" != "$LKC_VERIFIED_SOURCE_SHA" ]]; then
            echo "DEPLOY_SOURCE_COMMIT_MISMATCH" >&2
            exit 1
          fi
      - name: Install and build Functions
        working-directory: source
        run: |
          npm ci
          npm run build -w @lkc/functions
      - name: Authenticate with short-lived staging identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Materialize verified staging Functions dotenv
        working-directory: source
        if: inputs.operation == 'deploy'
        env:
          LKC_FUNCTIONS_ADMIN_EMAILS: ${{ vars.LKC_FUNCTIONS_ADMIN_EMAILS }}
          LKC_FUNCTIONS_EXECUTIVE_APPROVER_EMAILS: ${{ vars.LKC_FUNCTIONS_EXECUTIVE_APPROVER_EMAILS }}
          LKC_FUNCTIONS_PRODUCTION_FIREBASE_PROJECT_ID: ${{ vars.LKC_FUNCTIONS_PRODUCTION_FIREBASE_PROJECT_ID }}
          LKC_FUNCTIONS_APPROVAL_PACKAGE_KEY_ID: ${{ vars.LKC_FUNCTIONS_APPROVAL_PACKAGE_KEY_ID }}
          LKC_FUNCTIONS_DEFAULT_COMPANY_ID: ${{ vars.LKC_FUNCTIONS_DEFAULT_COMPANY_ID }}
          LKC_FUNCTIONS_STAFF_APP_URL: ${{ vars.LKC_FUNCTIONS_STAFF_APP_URL }}
          LKC_FUNCTIONS_ADMIN_APP_URL: ${{ vars.LKC_FUNCTIONS_ADMIN_APP_URL }}
          LKC_FUNCTIONS_MAIL_FROM: ${{ vars.LKC_FUNCTIONS_MAIL_FROM }}
          LKC_FUNCTIONS_GMAIL_DELEGATED_USER: ${{ secrets.LKC_FUNCTIONS_GMAIL_DELEGATED_USER }}
          LKC_FUNCTIONS_PUBLIC_LOGIN_GATEWAY_URL: ${{ vars.LKC_FUNCTIONS_PUBLIC_LOGIN_GATEWAY_URL }}
          LKC_FUNCTIONS_FILE_PREVIEW_GATEWAY_URL: ${{ vars.LKC_FUNCTIONS_FILE_PREVIEW_GATEWAY_URL }}
        run: |
          required=(
            LKC_FUNCTIONS_ADMIN_EMAILS
            LKC_FUNCTIONS_EXECUTIVE_APPROVER_EMAILS
            LKC_FUNCTIONS_PRODUCTION_FIREBASE_PROJECT_ID
            LKC_FUNCTIONS_APPROVAL_PACKAGE_KEY_ID
            LKC_FUNCTIONS_DEFAULT_COMPANY_ID
            LKC_FUNCTIONS_STAFF_APP_URL
            LKC_FUNCTIONS_ADMIN_APP_URL
            LKC_FUNCTIONS_MAIL_FROM
            LKC_FUNCTIONS_GMAIL_DELEGATED_USER
            LKC_FUNCTIONS_PUBLIC_LOGIN_GATEWAY_URL
            LKC_FUNCTIONS_FILE_PREVIEW_GATEWAY_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'STAGING_DOTENV_MISSING=%s\n' "$(IFS=,; echo "${missing[*]}")" >&2
            exit 1
          fi

          dotenv_path="functions/.env.${LKC_PROJECT_ID}"
          umask 077
          {
            printf 'APP_ENVIRONMENT=staging\n'
            printf 'LKC_NOTIFICATION_DELIVERY_MODE=paused\n'
            printf 'LKC_SHEET_WRITE_MODE=paused\n'
            printf 'EXPECTED_FIREBASE_PROJECT_ID=%s\n' "$LKC_PROJECT_ID"
            printf 'ADMIN_EMAILS=%s\n' "$LKC_FUNCTIONS_ADMIN_EMAILS"
            printf 'EXECUTIVE_APPROVER_EMAILS=%s\n' "$LKC_FUNCTIONS_EXECUTIVE_APPROVER_EMAILS"
            printf 'PRODUCTION_FIREBASE_PROJECT_ID=%s\n' "$LKC_FUNCTIONS_PRODUCTION_FIREBASE_PROJECT_ID"
            printf 'APPROVAL_PACKAGE_KEY_ID=%s\n' "$LKC_FUNCTIONS_APPROVAL_PACKAGE_KEY_ID"
            printf 'DEFAULT_COMPANY_ID=%s\n' "$LKC_FUNCTIONS_DEFAULT_COMPANY_ID"
            printf 'STAFF_APP_URL=%s\n' "$LKC_FUNCTIONS_STAFF_APP_URL"
            printf 'ADMIN_APP_URL=%s\n' "$LKC_FUNCTIONS_ADMIN_APP_URL"
            printf 'MAIL_FROM=%s\n' "$LKC_FUNCTIONS_MAIL_FROM"
            printf 'GMAIL_DELEGATED_USER=%s\n' "$LKC_FUNCTIONS_GMAIL_DELEGATED_USER"
            printf 'PUBLIC_LOGIN_GATEWAY_URL=%s\n' "$LKC_FUNCTIONS_PUBLIC_LOGIN_GATEWAY_URL"
            printf 'FILE_PREVIEW_GATEWAY_URL=%s\n' "$LKC_FUNCTIONS_FILE_PREVIEW_GATEWAY_URL"
          } > "$dotenv_path"
          chmod 600 "$dotenv_path"
          echo "STAGING_DOTENV=READY"
          echo "STAGING_DOTENV_KEY_COUNT=15"
      - name: Preserve or explicitly set submission transfer mode
        working-directory: guardrails
        if: inputs.operation == 'deploy'
        env:
          LKC_TRANSFER_MODE_REQUESTED: ${{ inputs.transfer_mode }}
          LKC_FUNCTIONS: ${{ inputs.functions }}
          LKC_SOURCE_DIRECTORY: ${{ github.workspace }}/source
        run: node scripts/automation/materialize-staging-transfer-mode.mjs
      - name: Deploy only the explicit Functions allowlist
        working-directory: guardrails
        env:
          LKC_VERIFIED_SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          LKC_SOURCE_REF: ${{ inputs.source_ref }}
          LKC_FUNCTIONS: ${{ inputs.functions }}
          LKC_CONFIRMATION: ${{ inputs.confirmation }}
          LKC_SOURCE_DIRECTORY: ${{ github.workspace }}/source
          LKC_OPERATION: ${{ inputs.operation }}
          LKC_TRANSFER_MODE_REQUESTED: ${{ inputs.transfer_mode }}
        run: bash scripts/automation/deploy-staging-functions.sh
      - name: Retain bounded upload source-refresh result
        if: always() && inputs.operation == 'upload-source-refresh'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upload-source-refresh-result
          path: upload-source-refresh-result.json
          if-no-files-found: error
          retention-days: 14

  smoke-guard:
    if: inputs.operation == 'gmail-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main and the staging enable switch
        env:
          LKC_DEPLOY_ENABLED: ${{ vars.LKC_STAGING_DEPLOY_ENABLED }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "GMAIL_SMOKE_RESULT=STOPPED_SAFELY"
            echo "GMAIL_SMOKE_ERROR=MAIN_REQUIRED"
            exit 1
          fi
          if [[ "$LKC_DEPLOY_ENABLED" != "true" ]]; then
            echo "GMAIL_SMOKE_RESULT=STOPPED_SAFELY"
            echo "GMAIL_SMOKE_ERROR=ENABLE_SWITCH_OFF"
            exit 1
          fi
      - name: Checkout trusted main guardrails
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Validate fixed Gmail smoke scope
        env:
          LKC_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node scripts/automation/validate-staging-scope.mjs \
            --mode gmail-smoke \
            --project "$LKC_PROJECT_ID" \
            --region "$LKC_REGION" \
            --source-ref main \
            --confirmation "$LKC_CONFIRMATION"

  gmail-smoke:
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'gmail-smoke' &&
      needs.smoke-guard.result == 'success'
    needs:
      - smoke-guard
    environment: lkc-staging-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the fixed smoke configuration
        env:
          LKC_DEPLOY_ENABLED: ${{ vars.LKC_STAGING_DEPLOY_ENABLED }}
          LKC_GMAIL_SMOKE_RECIPIENT_EMAIL: ${{ secrets.LKC_GMAIL_SMOKE_RECIPIENT_EMAIL }}
          LKC_EXPECTED_GMAIL_DELEGATED_USER: ${{ secrets.LKC_FUNCTIONS_GMAIL_DELEGATED_USER }}
          LKC_GMAIL_SMOKE_CONTINUE_URL: ${{ vars.LKC_FUNCTIONS_STAFF_APP_URL }}
          LKC_EXPECTED_MAIL_FROM: ${{ vars.LKC_FUNCTIONS_MAIL_FROM }}
          LKC_EXPECTED_GATEWAY_URL: ${{ vars.LKC_FUNCTIONS_PUBLIC_LOGIN_GATEWAY_URL }}
        run: |
          if [[ "$LKC_DEPLOY_ENABLED" != "true" ]]; then
            echo "GMAIL_SMOKE_ERROR=ENABLE_SWITCH_OFF"
            exit 1
          fi
          required=(
            LKC_GMAIL_SMOKE_RECIPIENT_EMAIL
            LKC_EXPECTED_GMAIL_DELEGATED_USER
            LKC_GMAIL_SMOKE_CONTINUE_URL
            LKC_EXPECTED_MAIL_FROM
            LKC_EXPECTED_GATEWAY_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'GMAIL_SMOKE_MISSING=%s\n' "$(IFS=,; echo "${missing[*]}")" >&2
            exit 1
          fi
          echo "GMAIL_SMOKE_CONFIGURATION=READY"
      - name: Prepare evidence directory
        run: |
          evidence_dir="$RUNNER_TEMP/gmail-single-mail-smoke-evidence"
          mkdir -p "$evidence_dir"
          echo "LKC_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
      - name: Checkout trusted main automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Authenticate with the short-lived staging observer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_OBSERVER_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Send and verify exactly one staging login email
        env:
          LKC_GMAIL_SMOKE_RECIPIENT_EMAIL: ${{ secrets.LKC_GMAIL_SMOKE_RECIPIENT_EMAIL }}
          LKC_EXPECTED_GMAIL_DELEGATED_USER: ${{ secrets.LKC_FUNCTIONS_GMAIL_DELEGATED_USER }}
          LKC_GMAIL_SMOKE_CONTINUE_URL: ${{ vars.LKC_FUNCTIONS_STAFF_APP_URL }}
          LKC_EXPECTED_MAIL_FROM: ${{ vars.LKC_FUNCTIONS_MAIL_FROM }}
          LKC_EXPECTED_GATEWAY_URL: ${{ vars.LKC_FUNCTIONS_PUBLIC_LOGIN_GATEWAY_URL }}
          LKC_GMAIL_SMOKE_RUN_ATTEMPT: ${{ github.run_attempt }}
          LKC_GMAIL_SMOKE_RUN_ID: ${{ github.run_id }}
        run: node scripts/automation/gmail-single-mail-smoke.mjs
      - name: Upload sanitized smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gmail-single-mail-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LKC_EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14
      - name: Publish Gmail smoke summary
        if: always()
        run: |
          {
            echo "## Staging Gmail single-mail smoke"
            echo
            echo "- Project: \`$LKC_PROJECT_ID\`"
            echo "- Function: \`requestStaffLoginLink\`"
            echo "- Run attempt: \`${{ github.run_attempt }}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Maximum request count: \`1\`"
            echo "- Sender/recipient separated: \`true\`"
            echo "- Production touched: \`false\`"
            echo "- Direct Firestore write: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cancellation-audit-guard:
    if: inputs.operation == 'cancellation-privacy-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require current main and explicit read-only audit scope
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_REF: ${{ inputs.source_ref }}
          FUNCTIONS: ${{ inputs.functions }}
          TRANSFER_MODE: ${{ inputs.transfer_mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Hanabo0930/Lip-Knots-Crew" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$WORKFLOW_REF" == "Hanabo0930/Lip-Knots-Crew/.github/workflows/staging-functions-deploy.yml@refs/heads/main" ]]
          [[ "$OPERATION" == "cancellation-privacy-audit" ]]
          [[ "$SOURCE_REF" == "main" ]]
          [[ "$FUNCTIONS" == "none" ]]
          [[ "$TRANSFER_MODE" == "preserve" ]]
          [[ "$CONFIRMATION" == "AUDIT_LKC_STAGING_CANCELLATION_PRIVACY" ]]
          current_main=$(gh api repos/Hanabo0930/Lip-Knots-Crew/git/ref/heads/main --jq '.object.sha')
          [[ "$current_main" == "$GITHUB_SHA" ]]
          gh api "repos/Hanabo0930/Lip-Knots-Crew/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" > "$RUNNER_TEMP/privacy-main-runs.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ["RUNNER_TEMP"]+"/privacy-main-runs.json") as f: runs=json.load(f)["workflow_runs"]
          current=[r for r in runs if r["head_sha"]==os.environ["GITHUB_SHA"] and r["path"]==".github/workflows/release-candidate.yml" and r["event"]=="push"]
          if not current or max(current,key=lambda r:r["id"])["conclusion"]!="success": raise SystemExit("CURRENT_MAIN_CANONICAL_CI_REQUIRED")
          PY

  cancellation-audit:
    if: inputs.operation == 'cancellation-privacy-audit'
    needs: cancellation-audit-guard
    environment: lkc-staging-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Recheck current main before observer auth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api repos/Hanabo0930/Lip-Knots-Crew/git/ref/heads/main --jq '.object.sha')" == "$GITHUB_SHA" ]]
      - name: Checkout verified main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node for read-only audit
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Authenticate existing staging observer for cancellation audit
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_OBSERVER_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI for read-only audit
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Read only status and cancellation flag
        shell: bash
        run: |
          set -euo pipefail
          set +x
          gcloud auth print-access-token | node scripts/audit-staging-cancellation-privacy.mjs --token-stdin --evidence "$RUNNER_TEMP/cancellation-privacy-audit"
      - name: Summarize aggregate cancellation audit only
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/cancellation-privacy-audit/privacy-audit.json" ]]; then
            cat "$RUNNER_TEMP/cancellation-privacy-audit/privacy-audit.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'CANCELLATION_PRIVACY_AUDIT=INCOMPLETE' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve aggregate cancellation audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-cancellation-privacy-audit
          path: ${{ runner.temp }}/cancellation-privacy-audit/privacy-audit.json
          if-no-files-found: warn
          retention-days: 7
