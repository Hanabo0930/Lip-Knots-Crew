name: Staging Hosting Promote
run-name: ${{ github.event_name == 'workflow_run' && 'promote' || inputs.operation || 'promote' }} staging Hosting${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'restore' && format(' from {0}', inputs.restore_run_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit mode; readiness never changes Hosting
        required: true
        default: promote
        type: choice
        options: [promote, readiness, restore]
      restore_run_id:
        description: Successful promotion run ID; required only for restore
        required: false
        type: string
      source_sha:
        description: Current CI-passing main SHA; leave blank to use current main
        required: false
        type: string
      confirmation:
        description: PROMOTE_LKC_STAGING_HOSTING / CHECK_LKC_STAGING_HOSTING_READINESS / RESTORE_LKC_STAGING_HOSTING
        required: true
        type: string
  workflow_run:
    workflows: [Staging Hosting Preview]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: lkc-staging-hosting-promote
  cancel-in-progress: false

env:
  LKC_PROJECT_ID: lip-knots-crew-staging
  LKC_REGION: asia-northeast1
  LKC_TARGETS: staff,admin

jobs:
  guard:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      channel: ${{ steps.release.outputs.channel }}
      should_promote: ${{ steps.release.outputs.should_promote }}
      operation: ${{ steps.release.outputs.operation }}
      restore_run_id: ${{ steps.release.outputs.restore_run_id }}
    steps:
      - name: Require the deliberate live-staging enable switch
        env:
          LKC_PROMOTE_ENABLED: ${{ vars.LKC_STAGING_HOSTING_PROMOTE_ENABLED }}
          LKC_OPERATION: ${{ github.event_name == 'workflow_run' && 'promote' || inputs.operation }}
        run: |
          if [[ "$LKC_OPERATION" != "readiness" && "$LKC_PROMOTE_ENABLED" != "true" ]]; then
            echo "HOSTING_PROMOTION_RESULT=STOPPED_SAFELY"
            echo "HOSTING_PROMOTION_ERROR=ENABLE_SWITCH_OFF"
            exit 1
          fi
      - name: Checkout current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Require current main, canonical CI and exact scope
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          LKC_REQUESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
          LKC_CONFIRMATION: ${{ github.event_name == 'workflow_run' && 'PROMOTE_LKC_STAGING_HOSTING' || inputs.confirmation }}
          LKC_OPERATION: ${{ github.event_name == 'workflow_run' && 'promote' || inputs.operation }}
          LKC_RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
          LKC_PREVIEW_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          node scripts/automation/restore-staging-hosting.mjs \
            --operation "$LKC_OPERATION" --guard-only \
            --confirmation "$LKC_CONFIRMATION" \
            --project "$LKC_PROJECT_ID" --region "$LKC_REGION"
          if [[ "$LKC_OPERATION" == "restore" && ! "$LKC_RESTORE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "HOSTING_OPERATION_ERROR=RESTORE_RUN_ID_REQUIRED"
            exit 1
          fi
          if [[ "$LKC_OPERATION" != "restore" && -n "$LKC_RESTORE_RUN_ID" ]]; then
            echo "HOSTING_OPERATION_ERROR=UNEXPECTED_RESTORE_RUN_ID"
            exit 1
          fi
          echo "operation=$LKC_OPERATION" >> "$GITHUB_OUTPUT"
          echo "restore_run_id=$LKC_RESTORE_RUN_ID" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin main
          source_sha="$(git rev-parse origin/main)"
          if [[ -n "$LKC_REQUESTED_SHA" && "$LKC_REQUESTED_SHA" != "$source_sha" ]]; then
            echo "HOSTING_PROMOTION_RESULT=STOPPED_SAFELY"
            echo "HOSTING_PROMOTION_ERROR=SOURCE_SHA_NOT_CURRENT_MAIN"
            exit 1
          fi
          if [[ ! "$source_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "HOSTING_PROMOTION_ERROR=SOURCE_SHA_INVALID"
            exit 1
          fi
          canonical_ci="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${source_sha}&status=completed&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "Release Candidate Checks" and .path == ".github/workflows/release-candidate.yml" and .event == "push" and .head_branch == "main" and .conclusion == "success")] | length'
          )"
          if [[ "$canonical_ci" -lt 1 ]]; then
            echo "HOSTING_PROMOTION_RESULT=STOPPED_SAFELY"
            echo "HOSTING_PROMOTION_ERROR=CANONICAL_CI_NOT_SUCCESSFUL"
            exit 1
          fi
          if [[ "$LKC_OPERATION" == "promote" ]]; then
            canonical_preview="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${source_sha}&status=completed&per_page=50" \
                --jq '[.workflow_runs[] | select(.name == "Staging Hosting Preview" and .path == ".github/workflows/staging-hosting-preview.yml" and .head_branch == "main" and .event == "workflow_run" and .conclusion == "success")] | length'
            )"
            if [[ "$canonical_preview" -lt 1 ]]; then
              echo "HOSTING_PROMOTION_RESULT=STOPPED_SAFELY"
              echo "HOSTING_PROMOTION_ERROR=CANONICAL_PREVIEW_NOT_SUCCESSFUL"
              exit 1
            fi
            if [[ -n "$LKC_PREVIEW_RUN_ID" ]]; then
              triggered_preview="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${LKC_PREVIEW_RUN_ID}" \
                  --jq '[.name, .event, .conclusion, .head_branch, .head_sha] | @tsv'
              )"
              expected_preview="$(printf 'Staging Hosting Preview\tworkflow_run\tsuccess\tmain\t%s' "$source_sha")"
              if [[ "$triggered_preview" != "$expected_preview" ]]; then
                echo "HOSTING_PROMOTION_RESULT=STOPPED_SAFELY"
                echo "HOSTING_PROMOTION_ERROR=TRIGGER_PREVIEW_MISMATCH"
                exit 1
              fi
            fi
          fi
          channel="rc-${source_sha:0:12}"
          if [[ "$LKC_OPERATION" == "promote" ]]; then
            node scripts/automation/validate-staging-scope.mjs \
              --mode hosting-promote \
              --project "$LKC_PROJECT_ID" \
              --region "$LKC_REGION" \
              --source-ref main \
              --targets "$LKC_TARGETS" \
              --channel "$channel" \
              --confirmation "$LKC_CONFIRMATION"
          else
            node scripts/automation/validate-staging-scope.mjs \
              --mode hosting-preview --project "$LKC_PROJECT_ID" \
              --region "$LKC_REGION" --source-ref main \
              --targets "$LKC_TARGETS" --channel "$channel"
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          prior_success="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${source_sha}&status=completed&per_page=50" \
              --jq "[.workflow_runs[] | select(.name == \"Staging Hosting Promote\" and .display_title == \"promote staging Hosting\" and .path == \".github/workflows/staging-hosting-promote.yml\" and .head_branch == \"main\" and .conclusion == \"success\" and .id != ${GITHUB_RUN_ID})] | length"
          )"
          if [[ "$LKC_OPERATION" == "promote" && "$prior_success" -gt 0 ]]; then
            echo "HOSTING_PROMOTION_RESULT=ALREADY_PROMOTED"
            echo "should_promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_promote=true" >> "$GITHUB_OUTPUT"

  promote:
    needs: guard
    if: needs.guard.outputs.should_promote == 'true'
    environment: lkc-staging-hosting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LKC_SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
      LKC_CHANNEL: ${{ needs.guard.outputs.channel }}
      LKC_ROLLBACK_CHANNEL: rb-${{ github.run_id }}
      LKC_OPERATION: ${{ needs.guard.outputs.operation }}
      LKC_RESTORE_RUN_ID: ${{ needs.guard.outputs.restore_run_id }}
      LKC_GCP_WORKLOAD_IDENTITY_PROVIDER: projects/740154137290/locations/global/workloadIdentityPools/lkc-github-staging/providers/lkc-main-workflows
      LKC_GCP_STAGING_DEPLOY_SERVICE_ACCOUNT: lkc-gh-staging-deploy@lip-knots-crew-staging.iam.gserviceaccount.com
    steps:
      - name: Prepare evidence directory
        run: |
          evidence_dir="$RUNNER_TEMP/hosting-promote-evidence"
          mkdir -p "$evidence_dir"
          echo "LKC_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
      - name: Checkout the exact CI-passing main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.LKC_SOURCE_SHA }}
          path: source
      - name: Re-check source is still current main after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ "$current_main" != "$LKC_SOURCE_SHA" ]]; then
            echo "HOSTING_PROMOTION_RESULT=STOPPED_SAFELY"
            echo "HOSTING_PROMOTION_ERROR=SOURCE_SHA_CHANGED_DURING_APPROVAL"
            exit 1
          fi
      - name: Stop source verification unless a no-fee path is established
        id: no_fee_source
        if: env.LKC_OPERATION != 'restore'
        working-directory: source
        run: |
          node scripts/automation/restore-staging-hosting.mjs \
            --no-fee-source-guard --project "$LKC_PROJECT_ID" --region "$LKC_REGION" \
            --source-sha "$LKC_SOURCE_SHA" --evidence-dir "$LKC_EVIDENCE_DIR"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked automation dependencies
        working-directory: source
        run: npm ci
      - name: Authenticate with the short-lived staging identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.LKC_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.LKC_GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      - name: Discover the two allowlisted Hosting sites
        id: hosting
        env:
          LKC_OPTIONAL_STAFF_SITE: ${{ vars.LKC_STAGING_STAFF_HOSTING_SITE }}
          LKC_OPTIONAL_ADMIN_SITE: ${{ vars.LKC_STAGING_ADMIN_HOSTING_SITE }}
        run: |
          (
            cd source
            npx firebase hosting:sites:list \
              --project "$LKC_PROJECT_ID" \
              --json > "$RUNNER_TEMP/lkc-hosting-sites.json"
          )
          node source/scripts/automation/prepare-staging-hosting-config.mjs \
            --source source \
            --sites-json "$RUNNER_TEMP/lkc-hosting-sites.json" \
            --project "$LKC_PROJECT_ID" \
            --region "$LKC_REGION" \
            --staff-site "$LKC_OPTIONAL_STAFF_SITE" \
            --admin-site "$LKC_OPTIONAL_ADMIN_SITE" \
            --discover-only \
            --github-output "$GITHUB_OUTPUT"
      - name: Resolve the exact preview versions
        if: env.LKC_OPERATION == 'promote'
        id: channel
        run: |
          (
            cd source
            npx firebase hosting:channel:list \
              --site "${{ steps.hosting.outputs.staff_site }}" \
              --project "$LKC_PROJECT_ID" \
              --json > "$RUNNER_TEMP/lkc-staff-channels.json"
            npx firebase hosting:channel:list \
              --site "${{ steps.hosting.outputs.admin_site }}" \
              --project "$LKC_PROJECT_ID" \
              --json > "$RUNNER_TEMP/lkc-admin-channels.json"
          )
          node source/scripts/automation/resolve-hosting-channel.mjs \
            --channel "$LKC_CHANNEL" \
            --staff-site "${{ steps.hosting.outputs.staff_site }}" \
            --admin-site "${{ steps.hosting.outputs.admin_site }}" \
            --staff-channels-json "$RUNNER_TEMP/lkc-staff-channels.json" \
            --admin-channels-json "$RUNNER_TEMP/lkc-admin-channels.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Re-check both preview apps before any live change
        if: env.LKC_OPERATION == 'promote'
        working-directory: source
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i \
              's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium --only-shell
          node scripts/automation/hosting-browser-check.mjs \
            --staff-url "${{ steps.channel.outputs.staff_url }}" \
            --admin-url "${{ steps.channel.outputs.admin_url }}" \
            --allowed-sites "${{ steps.hosting.outputs.staff_site }},${{ steps.hosting.outputs.admin_site }}" \
            --evidence-dir "$LKC_EVIDENCE_DIR/preview"
      - name: Set up Google Cloud CLI for read-only API verification
        if: env.LKC_OPERATION != 'restore'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Verify deployed upload APIs before any live Hosting change
        id: readiness
        if: env.LKC_OPERATION != 'restore'
        working-directory: source
        run: |
          npm run build -w @lkc/functions
          python3 scripts/automation/check-hosting-api-readiness.py \
            --root . \
            --source-sha "$LKC_SOURCE_SHA" \
            --evidence "$LKC_EVIDENCE_DIR/api-readiness.json"
      - name: Recheck current main before any live operation
        if: env.LKC_OPERATION != 'readiness'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e '
            import {requireCurrentMain} from "./scripts/automation/restore-staging-hosting.mjs";
            await requireCurrentMain(process.env.LKC_SOURCE_SHA);
          '
      - name: Back up both current live channels
        if: env.LKC_OPERATION == 'promote'
        id: backup
        working-directory: source
        run: |
          node scripts/automation/restore-staging-hosting.mjs \
            --backup --project "$LKC_PROJECT_ID" --region "$LKC_REGION" \
            --staff-site "${{ steps.hosting.outputs.staff_site }}" \
            --admin-site "${{ steps.hosting.outputs.admin_site }}" \
            --source-sha "$LKC_SOURCE_SHA" --channel "$LKC_ROLLBACK_CHANNEL" \
            --evidence-dir "$LKC_EVIDENCE_DIR" --github-output "$GITHUB_OUTPUT"
      - name: Capture both saved live and immutable preview versions
        id: capture
        if: env.LKC_OPERATION == 'promote'
        working-directory: source
        run: |
          node scripts/automation/restore-staging-hosting.mjs \
            --capture --project "$LKC_PROJECT_ID" --region "$LKC_REGION" \
            --staff-site "${{ steps.hosting.outputs.staff_site }}" \
            --admin-site "${{ steps.hosting.outputs.admin_site }}" \
            --source-sha "$LKC_SOURCE_SHA" --channel "$LKC_ROLLBACK_CHANNEL" \
            --preview-channel "$LKC_CHANNEL" --evidence-dir "$LKC_EVIDENCE_DIR" \
            --github-output "$GITHUB_OUTPUT"
      - name: Recheck the saved live pair immediately before promotion
        if: env.LKC_OPERATION == 'promote'
        working-directory: source
        run: |
          node scripts/automation/restore-staging-hosting.mjs \
            --verify-capture --project "$LKC_PROJECT_ID" --region "$LKC_REGION" \
            --staff-site "${{ steps.hosting.outputs.staff_site }}" \
            --admin-site "${{ steps.hosting.outputs.admin_site }}" \
            --source-sha "$LKC_SOURCE_SHA" --evidence-dir "$LKC_EVIDENCE_DIR"
      - name: Promote the already-tested versions without rebuilding
        if: env.LKC_OPERATION == 'promote'
        id: promotion
        continue-on-error: true
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/automation/restore-staging-hosting.mjs \
            --promote-capture --project "$LKC_PROJECT_ID" --region "$LKC_REGION" \
            --staff-site "${{ steps.hosting.outputs.staff_site }}" \
            --admin-site "${{ steps.hosting.outputs.admin_site }}" \
            --source-sha "$LKC_SOURCE_SHA" --evidence-dir "$LKC_EVIDENCE_DIR" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify both live staging apps after promotion
        id: live_check
        if: env.LKC_OPERATION == 'promote' && steps.promotion.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: |
          node scripts/automation/hosting-browser-check.mjs \
            --staff-url "${{ steps.hosting.outputs.staff_live_url }}" \
            --admin-url "${{ steps.hosting.outputs.admin_live_url }}" \
            --allowed-sites "${{ steps.hosting.outputs.staff_site }},${{ steps.hosting.outputs.admin_site }}" \
            --evidence-dir "$LKC_EVIDENCE_DIR/live"
      - name: Restore both previous live versions on any failure
        id: rollback
        if: >-
          always() &&
          env.LKC_OPERATION == 'promote' &&
          steps.backup.outputs.ready == 'true' &&
          steps.promotion.outputs.rollback_allowed == 'true' &&
          (steps.promotion.outcome == 'failure' ||
          (steps.promotion.outcome == 'success' && steps.live_check.outcome != 'success'))
        working-directory: source
        run: |
          node scripts/automation/restore-staging-hosting.mjs \
            --project "$LKC_PROJECT_ID" \
            --staff-site "${{ steps.hosting.outputs.staff_site }}" \
            --admin-site "${{ steps.hosting.outputs.admin_site }}" \
            --restore-capture --region "$LKC_REGION" \
            --source-sha "$LKC_SOURCE_SHA" \
            --evidence-dir "$LKC_EVIDENCE_DIR" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify both live staging apps after rollback
        id: rollback_check
        if: always() && steps.rollback.outputs.attempted == 'true'
        continue-on-error: true
        working-directory: source
        run: |
          node scripts/automation/hosting-browser-check.mjs \
            --staff-url "${{ steps.hosting.outputs.staff_live_url }}" \
            --admin-url "${{ steps.hosting.outputs.admin_live_url }}" \
            --allowed-sites "${{ steps.hosting.outputs.staff_site }},${{ steps.hosting.outputs.admin_site }}" \
            --evidence-dir "$LKC_EVIDENCE_DIR/rollback"
      - name: Persist successful promotion manifest before channel cleanup
        if: env.LKC_OPERATION == 'promote' && steps.promotion.outcome == 'success' && steps.live_check.outcome == 'success'
        working-directory: source
        run: |
          node scripts/automation/restore-staging-hosting.mjs \
            --finalize-capture --project "$LKC_PROJECT_ID" --region "$LKC_REGION" \
            --staff-site "${{ steps.hosting.outputs.staff_site }}" \
            --admin-site "${{ steps.hosting.outputs.admin_site }}" \
            --source-sha "$LKC_SOURCE_SHA" --evidence-dir "$LKC_EVIDENCE_DIR"
      - name: Remove temporary channels after a successful promotion
        if: env.LKC_OPERATION == 'promote' && steps.promotion.outcome == 'success' && steps.live_check.outcome == 'success'
        working-directory: source
        run: |
          node scripts/automation/restore-staging-hosting.mjs \
            --cleanup --project "$LKC_PROJECT_ID" --region "$LKC_REGION" \
            --staff-site "${{ steps.hosting.outputs.staff_site }}" \
            --admin-site "${{ steps.hosting.outputs.admin_site }}" \
            --source-sha "$LKC_SOURCE_SHA" --channel "$LKC_ROLLBACK_CHANNEL" \
            --preview-channel "$LKC_CHANNEL" --evidence-dir "$LKC_EVIDENCE_DIR"
      - name: Prepare existing browser check for manual restore
        if: env.LKC_OPERATION == 'restore'
        working-directory: source
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i \
              's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium --only-shell
      - name: Restore the exact pair from successful promotion evidence
        id: manual_restore
        if: env.LKC_OPERATION == 'restore'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          LKC_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node scripts/automation/restore-staging-hosting.mjs \
            --operation restore --confirmation "$LKC_CONFIRMATION" \
            --project "$LKC_PROJECT_ID" --region "$LKC_REGION" \
            --staff-site "${{ steps.hosting.outputs.staff_site }}" \
            --admin-site "${{ steps.hosting.outputs.admin_site }}" \
            --restore-run-id "$LKC_RESTORE_RUN_ID" --source-sha "$LKC_SOURCE_SHA" \
            --evidence-dir "$LKC_EVIDENCE_DIR" --github-output "$GITHUB_OUTPUT"
      - name: Check both live apps after manual restore
        id: manual_restore_check
        if: env.LKC_OPERATION == 'restore' && steps.manual_restore.outcome == 'success'
        working-directory: source
        run: |
          node scripts/automation/hosting-browser-check.mjs \
            --staff-url "${{ steps.hosting.outputs.staff_live_url }}" \
            --admin-url "${{ steps.hosting.outputs.admin_live_url }}" \
            --allowed-sites "${{ steps.hosting.outputs.staff_site }},${{ steps.hosting.outputs.admin_site }}" \
            --evidence-dir "$LKC_EVIDENCE_DIR/manual-restore-browser"
      - name: Upload promotion and rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-hosting-${{ env.LKC_OPERATION }}-${{ env.LKC_SOURCE_SHA }}
          path: ${{ env.LKC_EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30
      - name: Publish promotion summary
        if: always()
        run: |
          {
            echo "## Staging Hosting promotion"
            echo
            echo "- Operation: \`$LKC_OPERATION\`"
            echo "- Source: \`$LKC_SOURCE_SHA\`"
            echo "- Preview channel: \`$LKC_CHANNEL\`"
            echo "- Promotion result: \`${{ steps.promotion.outcome }}\`"
            echo "- Live browser result: \`${{ steps.live_check.outcome }}\`"
            echo "- Automatic rollback result: \`${{ steps.rollback.outcome }}\`"
            echo "- Staff rollback: \`${{ steps.rollback.outputs.staff_status || 'not-attempted' }}\`"
            echo "- Admin rollback: \`${{ steps.rollback.outputs.admin_status || 'not-attempted' }}\`"
            echo "- Rollback browser result: \`${{ steps.rollback_check.outcome }}\`"
            echo "- Functions deployed: \`false\`"
            echo "- Firestore / Storage / Rules / IAM changed: \`false\`"
            echo "- Production touched: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce the final result
        if: always()
        run: |
          if [[ "$LKC_OPERATION" == "readiness" ]]; then
            if [[ "${{ steps.readiness.outcome }}" != "success" ]]; then
              echo "HOSTING_READINESS_RESULT=STOPPED_SAFELY"
              exit 1
            fi
            echo "HOSTING_READINESS_RESULT=SUCCESS"
            exit 0
          fi
          if [[ "$LKC_OPERATION" == "restore" ]]; then
            if [[ "${{ steps.manual_restore.outcome }}" != "success" || "${{ steps.manual_restore_check.outcome }}" != "success" ]]; then
